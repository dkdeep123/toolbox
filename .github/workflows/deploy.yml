name: Deploy ToolBoxPro to GitHub Pages

on:
  push:
    branches: [main]
  # Allow manual trigger from the Actions tab
  workflow_dispatch:

# Sets the GITHUB_TOKEN permissions required to deploy to Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment; cancel in-progress runs
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      # Upload only the toolboxpro/ subfolder as the site root
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: toolboxpro/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
