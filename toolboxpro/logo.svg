<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <!-- Deep Obsidian Carbon Squircle Background -->
    <linearGradient id="tbp-sq-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Metallic Specular Rim Light -->
    <linearGradient id="tbp-sq-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="45%" stop-color="#818cf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>

    <!-- Top Isometric Crossbar Facet (Laser Cyan to Electric Blue) -->
    <linearGradient id="tbp-f-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="40%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <!-- Left Isometric Stem Facet (Cobalt to Royal Indigo) -->
    <linearGradient id="tbp-f-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <!-- Right Isometric Stem Facet (Deep Indigo to Obsidian Violet) -->
    <linearGradient id="tbp-f-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>

    <!-- High-Performance Drop Glow -->
    <filter id="tbp-core-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="3.5" flood-color="#0ea5e9" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Container Squircle with Hairline Specular Bezel -->
  <rect x="2" y="2" width="44" height="44" rx="12" fill="url(#tbp-sq-bg)"/>
  <rect x="2.5" y="2.5" width="43" height="43" rx="11.5" stroke="url(#tbp-sq-rim)" stroke-width="1"/>

  <!-- Isometric 3D "T" Modular Prism Mark -->
  <g filter="url(#tbp-core-glow)">
    <!-- Top Rhombus Facet (The T-Crossbar) -->
    <path d="M24 10.5 C24.5 10.2 25.1 10.2 25.6 10.5 L36.2 16.6 C37.3 17.2 37.3 18.8 36.2 19.4 L25.6 25.5 C25.1 25.8 24.5 25.8 24 25.5 L13.4 19.4 C12.3 18.8 12.3 17.2 13.4 16.6 Z" fill="url(#tbp-f-top)"/>

    <!-- Specular Highlight Ridge on Top Bar -->
    <path d="M15 17.5 L24.8 11.8 L34.5 17.5" stroke="#ffffff" stroke-width="1.1" stroke-linecap="round" stroke-opacity="0.75"/>

    <!-- Left Isometric Facet (Stem & Left 3D Depth) -->
    <path d="M13 21.5 C12.4 21.8 12 22.4 12 23.1 L12 29.5 C12 30.6 12.6 31.6 13.5 32.1 L21.5 36.7 C22.4 37.2 23.5 36.6 23.5 35.5 L23.5 27.5 C23.5 26.8 23.1 26.2 22.5 25.8 Z" fill="url(#tbp-f-left)"/>

    <!-- Right Isometric Facet (Stem & Right 3D Depth) -->
    <path d="M25.5 25.8 C24.9 26.2 24.5 26.8 24.5 27.5 L24.5 35.5 C24.5 36.6 25.6 37.2 26.5 36.7 L34.5 32.1 C35.4 31.6 36 30.6 36 29.5 L36 23.1 C36 22.4 35.6 21.8 35 21.5 Z" fill="url(#tbp-f-right)"/>

    <!-- Optical Core Precision Sparkle -->
    <circle cx="24" cy="23.5" r="1.5" fill="#ffffff" fill-opacity="0.95"/>
    <circle cx="24" cy="23.5" r="3" fill="#38bdf8" fill-opacity="0.45"/>
  </g>
</svg>
