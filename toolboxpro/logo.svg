<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="tbp-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#635bff"/>
      <stop offset="50%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    
    <!-- Accent / Spark Gradient -->
    <linearGradient id="tbp-accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <!-- Tray / Metallic Gradient -->
    <linearGradient id="tbp-metal-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#e0e7ff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#c7d2fe" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="tbp-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#4f46e5" flood-opacity="0.35"/>
    </filter>
    
    <!-- Glow for Sparkle -->
    <filter id="tbp-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Container Squircle with Shadow -->
  <rect x="2" y="2" width="44" height="44" rx="12" fill="url(#tbp-bg-grad)" filter="url(#tbp-shadow)"/>
  
  <!-- Subtle Border Reflection -->
  <rect x="2.5" y="2.5" width="43" height="43" rx="11.5" stroke="white" stroke-opacity="0.25" stroke-width="1"/>

  <!-- Toolbox Handle -->
  <path d="M19 13.5 C19 11.5 20.5 10 22.5 10 L25.5 10 C27.5 10 29 11.5 29 13.5 L29 15 L19 15 Z" 
        fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Toolbox Lid (Top section) -->
  <path d="M10 16 C10 15 11 14 12.5 14 L35.5 14 C37 14 38 15 38 16 L38 22 L10 22 Z" 
        fill="white" fill-opacity="0.18"/>

  <!-- Toolbox Main Body -->
  <path d="M10 22 L38 22 L36.2 34.5 C36 36 34.7 37 33.2 37 L14.8 37 C13.3 37 12 36 11.8 34.5 Z" 
        fill="white" fill-opacity="0.28"/>

  <!-- Center Latch / Lock -->
  <rect x="21" y="20" width="6" height="5" rx="1.5" fill="url(#tbp-metal-grad)"/>
  <circle cx="24" cy="22.5" r="0.8" fill="#4338ca"/>

  <!-- Horizontal Trim Line -->
  <line x1="10" y1="22" x2="38" y2="22" stroke="white" stroke-opacity="0.35" stroke-width="1.2"/>

  <!-- Dynamic Star / Sparkle in Top-Right Corner -->
  <g filter="url(#tbp-glow)">
    <path d="M36 7 C36 9 37.5 10.5 39.5 10.5 C37.5 10.5 36 12 36 14 C36 12 34.5 10.5 32.5 10.5 C34.5 10.5 36 9 36 7 Z" 
          fill="#38bdf8"/>
  </g>
</svg>
